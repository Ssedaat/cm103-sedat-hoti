<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>Connection successful | Project 1</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #101827;
            color: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 18% 18%, rgba(51, 107, 255, 0.2), transparent 38%),
                radial-gradient(ellipse at 85% 82%, rgba(40, 211, 153, 0.12), transparent 34%),
                #101827;
        }

        main {
            width: min(100%, 560px);
            padding: clamp(32px, 7vw, 56px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            background: rgba(24, 35, 53, 0.88);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .status-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(67, 225, 170, 0.25);
            border-radius: 22px;
            background: rgba(39, 197, 144, 0.12);
            color: #55e5ad;
            font-size: 34px;
            box-shadow: 0 0 36px rgba(39, 197, 144, 0.1);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #83aaff;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -0.055em;
            line-height: 1.1;
        }

        .description {
            max-width: 380px;
            margin: 18px auto 0;
            color: #aeb9ca;
            font-size: 1rem;
            line-height: 1.7;
        }

        .status {
            margin: 32px 0 0;
            padding: 14px 18px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(85, 229, 173, 0.18);
            border-radius: 999px;
            background: rgba(39, 197, 144, 0.08);
            color: #c9f8e6;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .status::before {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #55e5ad;
            box-shadow: 0 0 12px rgba(85, 229, 173, 0.75);
            content: "";
        }

        footer {
            margin-top: 40px;
            color: #718096;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="status-icon" aria-hidden="true">&#10003;</div>
        <p class="eyebrow">Project 1 - Web server</p>
        <h1>You're connected.</h1>
        <p class="description">This page is being served by own Python web server. Everything is running.</p>
        <p class="status">Connection is working</p>
    </main>
</body>
</html>
